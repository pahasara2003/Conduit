[package]
name = "clipsync-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio-stream = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
